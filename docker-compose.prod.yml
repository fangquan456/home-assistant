name: gendome-ha-prod

services:
  homeassistant:
    container_name: gendome-home-assistant-prod
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./config-prod:/config
      - ./custom_components/gendome:/config/custom_components/gendome:ro
    environment:
      TZ: Asia/Shanghai
      GENDOME_ENV: prod
      GENDOME_OAUTH_MODE: public_pkce
